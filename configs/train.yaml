# 这是后续短训练的初始配置，尚未调优。
# max_steps 表示优化器更新次数，不是 epoch 数。
# 其余参数保留现有初始设置，尚未用于 SO101 数据训练。
# 数据源尚未实现，当前命令行训练入口不可运行。
seed: 42 # 随机种子，用于轨迹划分和随机运算
val_ratio: 0.2 # 验证轨迹比例，轨迹数量乘此比例后向下取整
batch_size: 2 # 每个批次的样本数量
num_workers: 0 # 数据加载进程数，0 表示使用主进程
learning_rate: 0.0001 # 所有模型参数共用的学习率
weight_decay: 0.0001 # AdamW 的权重衰减系数
kl_weight: 10.0 # 潜变量 KL 损失权重
max_steps: 1000 # 后续训练的优化器更新总次数
log_every: 10 # 后续训练每多少次更新记录日志
eval_every: 100 # 后续训练每多少次更新进行验证
save_every: 100 # 后续训练每多少次更新保存模型
output_dir: outputs/act_so101 # 后续训练结果保存目录，相对于项目根目录
