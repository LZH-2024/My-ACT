# SO101 初始接口规划：五个机械臂关节加夹爪，一路相机；尚未采集数据或验证仿真。
state_dim: 6 # 状态维度：六个实际关节位置，拟使用弧度
action_dim: 6 # 单步动作维度：六个关节位置目标，拟使用弧度
num_cameras: 1 # 相机数量：初始规划为一路固定相机
image_size: 224 # 输入图像尺寸：高度和宽度均为 224 像素
chunk_size: 16 # 动作块长度：一次预测连续 16 步动作
hidden_dim: 256 # 模型内部特征维度：Transformer 用 256 维向量表示特征
latent_dim: 32 # 潜变量维度：CVAE 用 32 维向量表示动作序列的潜在信息
nheads: 8 # 注意力头数：将注意力计算分为 8 个头
encoder_layers: 4 # Transformer 编码器层数
decoder_layers: 4 # Transformer 解码器层数
cvae_layers: 4 # CVAE 编码器层数
dim_feedforward: 1024 # Transformer 前馈网络的中间特征维度
dropout: 0.1 # 训练时随机丢弃部分特征的比例，用于缓解过拟合
backbone: resnet18 # 图像特征提取网络的名称
pretrained_backbone: true # 是否使用图像特征提取网络的预训练权重
