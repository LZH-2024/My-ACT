# 实际任务名称：put the bowl on the plate
# 数据格式版本：LeRobot v3.0
# 下载脚本中的数据 revision：a1aaacb7f6cd6ee5fb43120f673cebb0cfea7dd4

dataset: # 单任务数据配置
  root: data/libero # 数据目录，相对于项目根目录
  task_index: 10 # 本地任务元数据中对应的任务编号
  camera_keys: # 相机字段；以下顺序就是模型输入的相机顺序
    - observation.images.image # 第一输入相机
    - observation.images.image2 # 第二输入相机
